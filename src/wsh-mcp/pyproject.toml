[project]
name = "wsh-mcp"
version = "0.1.0"
description = "MCP server exposing the Witchcraft Compiler Collection Shell (wsh) to LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Brossard", email = "endrazine@gmail.com" },
]
keywords = ["mcp", "wsh", "wcc", "binary-analysis", "reverse-engineering", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "mcp>=2.0",
]

[project.scripts]
wsh-mcp = "wsh_mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
